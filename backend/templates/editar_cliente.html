<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TallerPro | Editar cliente</title>

    <!-- Conectamos el CSS principal de TallerPro -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <!-- Encabezado y navegación -->
    <header>
        <h1>TallerPro</h1>
        
        <p>Editar cliente</p>
        {% if error %}
            <p class="mensaje-error">{{ error }}</p>
        {% endif %}

        <nav>
            <a href="/">Inicio</a>
            <a href="/clientes">Clientes</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Editar cliente</h2>

            <!-- Formulario para modificar los datos del cliente -->
            <form action="/clientes/editar/{{ cliente.id }}"
                  method="POST"
                  class="formulario-card">

                <label for="nombre">Nombre:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    value="{{ cliente.nombre }}"
                    readonly
                >

                <label for="apellido">Apellido:</label>
                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    value="{{ cliente.apellido }}"
                    readonly
                >

                <!-- Permitimos consultar y modificar el DNI -->
                <label for="dni">DNI:</label>
                <input
                    type="text"
                    id="dni"
                    name="dni"
                    value="{{ cliente.dni or '' }}"
                    inputmode="numeric"
                    pattern="[0-9]{7,8}"
                    minlength="7"
                    maxlength="8"
                    title="Ingresá un DNI de 7 u 8 números, sin puntos"
                    placeholder="Ej.: 30123456"
                    required
                >

                <label for="telefono">Teléfono:</label>
                <input
                    type="text"
                    id="telefono"
                    name="telefono"
                    value="{{ cliente.telefono }}"
                    maxlength="20"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ cliente.email or '' }}"
                    maxlength="100"
                >

                <!-- Guardar los cambios -->
                <button type="submit" class="boton-accion">
                    Guardar cambios
                </button>

                <!-- Cancelar la edición -->
                <a href="/clientes" class="boton-volver">
                    Cancelar y volver a clientes
                </a>

            </form>

        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 TallerPro</p>
    </footer>

</body>

</html>
