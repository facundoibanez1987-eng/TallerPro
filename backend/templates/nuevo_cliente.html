<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TallerPro | Nuevo cliente</title>

    <!-- Conectamos el CSS principal de TallerPro -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <!-- Encabezado y navegación -->
    <header>
        <h1>TallerPro</h1>
        <p>Registrar nuevo cliente</p>

        <nav>
            <a href="/">Inicio</a>
            <a href="/clientes">Clientes</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Nuevo cliente</h2>

            <!-- Mostramos los errores de validación, si existen -->
            {% if error %}
                <p class="mensaje-error">{{ error }}</p>
            {% endif %}
            <!-- Formulario para registrar un cliente -->
            <form action="/clientes/nuevo" method="POST" class="formulario-card">

                <label for="nombre">Nombre:</label>
                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    maxlength="50"
                    value="{{ nombre or '' }}"
                    required
                >

                <label for="apellido">Apellido:</label>
                <input
                    type="text"
                    id="apellido"
                    name="apellido"
                    maxlength="50"
                    value="{{ apellido or '' }}"
                    required
                >

                <!-- Solicitamos el DNI del cliente -->
                <label for="dni">DNI:</label>
                <input
                    type="text"
                    id="dni"
                    name="dni"
                    value="{{ dni or '' }}"
                    inputmode="numeric"
                    pattern="[0-9]{7,8}"
                    minlength="7"
                    maxlength="8"
                    title="Ingresá un DNI de 7 u 8 números, sin puntos"
                    placeholder="Ej.: 30123456"
                    required
                >

                <label for="telefono">Teléfono:</label>
                <input
                    type="text"
                    id="telefono"
                    name="telefono"
                    maxlength="20"
                    value="{{ telefono or '' }}"
                    required
                >

                <label for="email">Email:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    maxlength="100"
                    value="{{ email or '' }}"
                >

                <!-- Botón para guardar el cliente -->
                <button type="submit" class="boton-accion">
                    Registrar cliente
                </button>

                <!-- Volver al listado sin guardar -->
                <a href="/clientes" class="boton-volver">
                    Cancelar y volver a clientes
                </a>

            </form>

        </section>

    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 TallerPro</p>
    </footer>

</body>

</html>
